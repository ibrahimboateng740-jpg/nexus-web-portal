<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheNexusWeb - Signup Node</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: Arial, sans-serif; }
        .nexus-blue { color: #0254eb; }
        .portal-panel-header { background: linear-gradient(to bottom, #f5fafe 0%, #e4f2fc 100%); border-bottom: 1px solid #7bc5ff; }
        .nexus-input { border: 1px solid #7bc5ff; border-radius: 4px; padding: 8px; width: 100%; font-size: 13px; outline: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">
    <header class="w-full bg-[#f4f7f9] border-b border-gray-300 px-4 py-1.5 flex justify-between items-center text-xs text-gray-600">
        <div class="flex items-center gap-4"><strong>TheNexusWeb Headquarters</strong> <a href="/" class="text-blue-700 hover:underline">Home</a></div>
    </header>
    
    <section class="w-full max-w-6xl mx-auto pt-8 pb-4 px-4 flex flex-col items-center">
        <h1 class="text-4xl font-black italic nexus-blue">TheNexusWeb<span class="not-italic text-amber-500">!</span></h1>
        <span class="text-[10px] font-bold bg-blue-50 border border-blue-200 px-1.5 rounded uppercase font-mono mt-1">NEW_USER_INITIATION</span>
    </section>
    
    <div class="flex-1 max-w-xl w-full mx-auto p-4 overflow-y-auto">
        <div class="border border-gray-300 rounded overflow-hidden bg-white shadow-lg mb-8">
            <div class="portal-panel-header px-4 py-3 flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-800">Establish Community Profile</h2>
            </div>
            
            <div class="p-8 flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs font-bold text-gray-700 block mb-1">First Name:</label><input type="text" class="nexus-input"></div>
                    <div><label class="text-xs font-bold text-gray-700 block mb-1">Last Name:</label><input type="text" class="nexus-input"></div>
                </div>
                <div><label class="text-xs font-bold text-gray-700 block mb-1">Email Address:</label><input type="email" class="nexus-input"></div>
                <div><label class="text-xs font-bold text-gray-700 block mb-1">Choose Passkey:</label><input type="password" class="nexus-input"></div>
                <button class="w-full bg-gradient-to-b from-[#bce1fd] to-[#7bc5ff] border border-[#4a89c0] py-2.5 rounded font-bold text-blue-900 shadow hover:to-[#5caee6]">Register Profile</button>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-1 border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 font-mono text-[10px]">OR COMPASS VIA GOOGLE OUTLET</span>
                    <div class="flex-1 border-t border-gray-200"></div>
                </div>
                
                <a href="/oauth2/authorization/google" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded py-2 text-xs font-bold text-gray-700 shadow-sm hover:bg-gray-50 transition-colors">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.53-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.08 1.16-3.13 0-5.78-2.11-6.73-4.96H1.21v3.15C3.18 21.88 7.31 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.27 14.24A7.16 7.16 0 0 1 5 12c0-.79.13-1.57.38-2.34V6.51H1.21A11.94 11.94 0 0 0 0 12c0 1.92.45 3.74 1.21 5.39l4.06-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 5.39l4.06 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                    </svg>
                    Sign Up with Google account
                </a>
                
                <div class="text-center pt-2"><a href="/login" class="text-xs text-blue-700 hover:underline">Already Member? Return to Login</a></div>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
