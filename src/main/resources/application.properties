# Explicit Server Port Binding
server.port=12000

# Disable proxy header strategies for local machine tracking
server.forward-headers-strategy=NONE

# Fast-Boot Temporary Database Profile
spring.datasource.url=jdbc:h2:mem:nexusdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Google Client Target Matrix Credentials
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
