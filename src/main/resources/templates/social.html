<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheNexusWeb | Social Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .header { padding: 20px; border-bottom: 1px solid #333; display: flex; align-items: center; }
        .back-btn { color: #8A2BE2; text-decoration: none; margin-right: 20px; font-size: 1.2rem; }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .social-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; height: 600px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h1>Social Hub</h1>
    </div>

    <div class="container">
        <div class="social-card">
            <h3><i class="fa-brands fa-x-twitter"></i> Trending on X</h3>
            <a class="twitter-timeline" data-height="500" data-theme="dark" href="https://twitter.com/X?ref_src=twsrc%5Etfw">Tweets</a> 
            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>

        <div class="social-card">
            <h3><i class="fa-brands fa-instagram"></i> Instagram Feed</h3>
            <div style="height: 400px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 10px;">
                <p style="color: #555; text-align: center;">Connecting to Meta API...<br><small>Login to sync your feed</small></p>
            </div>
        </div>
    </div>
</body>
</html>
