<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Web Portal | Official</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            border: 1px solid #30363d;
            padding: 2rem;
            border-radius: 12px;
            background: #161b22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; margin-bottom: 0.5rem; }
        p { color: #8b949e; font-size: 1.1rem; }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .ad-container {
            margin-top: 20px;
            padding: 10px;
            border: 1px dashed #484f58;
            min-height: 100px;
        }
    </style>

    </head>
<body>

    <div class="container">
        <h1>Nexus Corporations</h1>
        <p><span class="status-dot"></span> Systems Online | Web Portal v1.0</p>
        <hr style="border: 0; border-top: 1px solid #30363d; margin: 20px 0;">
        
        <div class="content">
            <h3>Welcome, User</h3>
            <p>The Nexus Web Portal is now active and broadcasting on Port 12000.</p>
        </div>

        <div class="ad-container">
            <small style="display:block; margin-bottom: 5px;">Sponsored Content</small>
            </div>
    </div>

</body>
</html>
