<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cinema HQ | TheNexusWeb</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --nexus-red: #d81e06; --nexus-dark: #0f0f0f; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--nexus-dark); color: #fff; display: flex; }
        
        /* SIDEBAR INTERFACE */
        .sidebar { width: 240px; background: #000; height: 100vh; position: fixed; border-right: 1px solid #222; }
        .nav-item { display: flex; align-items: center; padding: 15px 25px; text-decoration: none; color: #999; font-size: 13px; font-weight: 600; gap: 12px; }
        .nav-item.active { background: #161616; color: #fff; border-left: 4px solid var(--nexus-red); }
        
        /* MAIN INTERFACE */
        .main-content { margin-left: 240px; flex-grow: 1; padding: 40px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .category-bar { display: flex; gap: 15px; margin-bottom: 30px; }
        .cat-btn { background: #1c1c1c; border: 1px solid #333; color: #aaa; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background: var(--nexus-red); color: #fff; border-color: var(--nexus-red); }
        
        .search-box { width: 100%; max-width: 600px; padding: 15px 25px; background: #1c1c1c; border: 1px solid #333; border-radius: 30px; color: #fff; font-size: 16px; outline: none; margin-bottom: 40px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        .movie-card { background: #161616; border-radius: 8px; border: 1px solid #222; padding: 12px; transition: 0.3s; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--nexus-red); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; background: #222; }
        .title { font-weight: bold; font-size: 14px; margin: 12px 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 11px; color: #666; margin-bottom: 12px; }
        .btn-acquire { width: 100%; background: #252525; border: 1px solid #3d3d3d; color: #fff; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-acquire:hover { background: var(--nexus-red); border-color: var(--nexus-red); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding:25px; font-weight:900; color:var(--nexus-red); font-family:serif; font-size:22px;">TheNexusWeb</div>
        <a href="/" class="nav-item"><i class="fa-solid fa-house"></i> Home Hub</a>
        <a href="/news" class="nav-item"><i class="fa-solid fa-rss"></i> News HQ</a>
        <a href="/movies" class="nav-item active"><i class="fa-solid fa-film"></i> Cinema HQ</a>
        <a href="/music" class="nav-item"><i class="fa-solid fa-music"></i> Global Beats</a>
        <a href="/weather" class="nav-item"><i class="fa-solid fa-cloud-sun"></i> Met-Office</a>
    </div>

    <div class="main-content">
        <h2>CINEMA INTELLIGENCE INDEX</h2>
        <input type="text" id="movie-search" class="search-box" placeholder="Query global databases for infinite film records..." onkeyup="if(event.key==='Enter') executeSearch()">
        
        <div class="category-bar">
            <button class="cat-btn active" onclick="filterCat('action', this)">Action</button>
            <button class="cat-btn" onclick="filterCat('sci-fi', this)">Sci-Fi</button>
            <button class="cat-btn" onclick="filterCat('thriller', this)">Thriller</button>
            <button class="cat-btn" onclick="filterCat('epic', this)">Epic</button>
        </div>

        <div id="grid" class="movie-grid">Loading Terminal Data...</div>
    </div>

    <script>
        async function executeSearch(term = null) {
            const query = term || document.getElementById('movie-search').value || '2026';
            const grid = document.getElementById('grid');
            grid.innerHTML = '<p>Querying decentralized catalog arrays...</p>';
            
            try {
                const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(query)}&apikey=4f458a6f`);
                const data = await res.json();
                if(data.Search) {
                    grid.innerHTML = data.Search.map(m => `
                        <div class="movie-card">
                            <img src="${m.Poster !== 'N/A' ? m.Poster : 'https://via.placeholder.com/300x450'}" class="poster">
                            <div class="title">${m.Title}</div>
                            <div class="meta">${m.Year} • ${m.Type.toUpperCase()}</div>
                            <a href="https://www.amazon.com/s?k=${encodeURIComponent(m.Title)}+movie" target="_blank" class="btn-acquire">📍 RENT / BUY OPTIONS</a>
                        </div>
                    `).join('');
                } else { grid.innerHTML = '<p>No listings discovered matching criteria.</p>'; }
            } catch(e) { grid.innerHTML = '<p>Signal interference. Re-try execution.</p>'; }
        }

        function filterCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            executeSearch(cat);
        }
        window.onload = () => executeSearch('2026');
    </script>
</body>
</html>
