<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheNexusWeb | Global Headquarters</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #fff; text-align: center; }
        .nav-bar { display: flex; justify-content: flex-end; padding: 20px; gap: 20px; }
        .nav-bar a { text-decoration: none; color: #333; font-size: 14px; }
        
        .main-content { margin-top: 100px; }
        .nexus-logo { font-size: 90px; font-weight: 900; color: #d81e06; font-family: serif; margin-bottom: 30px; }
        
        /* THE SEARCH BOX FIX */
        .search-form { max-width: 600px; margin: auto; position: relative; }
        .search-input { width: 100%; padding: 15px 25px; border-radius: 30px; border: 1px solid #dfe1e5; font-size: 16px; outline: none; box-shadow: none; transition: 0.3s; }
        .search-input:hover, .search-input:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
        
        .btn-group { margin-top: 30px; display: flex; justify-content: center; gap: 15px; }
        .btn { background: #f8f9fa; border: 1px solid #f8f9fa; padding: 10px 20px; color: #3c4043; border-radius: 4px; cursor: pointer; }
        .btn:hover { border: 1px solid #dadce0; color: #202124; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="/social">Social Hub</a>
    <a href="/news">Global News</a>
    <a href="/login">Account</a>
</div>

<div class="main-content">
    <div class="nexus-logo">TheNexusWeb</div>

    <form action="/search" method="GET" class="search-form">
        <input type="text" name="q" class="search-input" placeholder="Search the Nexus Logic Engine...">
        <div class="btn-group">
            <input type="submit" class="btn" value="Nexus Search">
            <button type="button" class="btn" onclick="location.href='/help'">Get Help</button>
        </div>
    </form>
</div>

<footer style="margin-top: 200px; font-size: 12px; color: #70757a;">
    <p>&copy; 2026 TheNexusWeb HQ | Accra &bull; New York</p>
</footer>

</body>
</html>
