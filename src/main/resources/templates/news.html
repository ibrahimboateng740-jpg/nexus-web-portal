<script>
    const API_KEY = '7f670038ba5d43ac8d887a8e9f9d7fb7';
    async function fetchNews(category = 'general') {
        const grid = document.getElementById('news-grid');
        grid.innerHTML = '<p>📡 Syncing Live Feeds...</p>';
        try {
            // Adding a timestamp (_=${Date.now()}) forces fresh results every refresh
            const res = await fetch(`https://newsapi.org/v2/top-headlines?category=${category}&language=en&apiKey=${API_KEY}&_=${Date.now()}`);
            const data = await res.json();
            grid.innerHTML = '';
            data.articles.forEach(article => {
                if(!article.urlToImage) return;
                grid.innerHTML += `
                    <div class="news-card">
                        <img src="${article.urlToImage}" class="news-img">
                        <div class="news-body">
                            <span class="news-source">${article.source.name}</span>
                            <a href="${article.url}" target="_blank" class="news-title">${article.title}</a>
                        </div>
                    </div>`;
            });
        } catch (e) { grid.innerHTML = "Uplink Error."; }
    }
    window.onload = () => fetchNews();
</script>
