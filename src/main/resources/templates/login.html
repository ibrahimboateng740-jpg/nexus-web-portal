<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus | Login</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #8A2BE2; --border: #30363d; }
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .card { background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-google { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; background: white; border-radius: 8px; color: black; text-decoration: none; font-weight: 600; margin-top: 20px; }
        .btn-google img { width: 18px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: var(--accent);">Nexus Portal</h2>
        <input type="text" id="user" placeholder="Username">
        <input type="password" placeholder="Password">
        <button onclick="localStorage.setItem('isLoggedIn', 'true'); window.location.href='/'" style="width:100%; padding:12px; background:var(--accent); border:none; color:white; border-radius:8px; cursor:pointer;">Login</button>
        <div style="margin: 20px 0; border-bottom: 1px solid var(--border);"></div>
        <a href="/oauth2/authorization/google" class="btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"> Sign in with Google
        </a>
    </div>
</body>
</html>
