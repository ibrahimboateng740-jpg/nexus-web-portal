<div id="hq-feed-content">
    </div>

<div id="hq-sentinel" style="height: 20px; margin-bottom: 50px;"></div>

<div id="hq-loader" style="display:none; text-align:center; padding:20px;">
    <div class="live-dot"></div> Updating Headquarters Feed...
</div>

<script>
    // 1. CONFIGURATION
    const hqSources = [
        { name: 'TechCrunch', tag: 'News', url: 'https://techcrunch.com/feed/' },
        { name: 'NY Tech', tag: 'X', url: 'https://rss.app/feeds/example1.xml' }
    ];

    let postCount = 0; // Tracks how many we've shown
    let isLoading = false;

    // 2. THE ENGINE: FETCHES & BUILDS POSTS
    async function loadMorePosts() {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('hq-loader').style.display = 'block';

        const feedContainer = document.getElementById('hq-feed-content');
        let newHTML = '';

        for (let source of hqSources) {
            try {
                // We add a timestamp to the URL to trick the cache into giving us fresh data
                const apiCall = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}&_=${Date.now()}`;
                const response = await fetch(apiCall);
                const data = await response.json();

                if (data.status === 'ok') {
                    // We grab a small "slice" of posts based on how many times we've scrolled
                    // This simulates "infinite" loading from the feed
                    const start = postCount;
                    const end = postCount + 3;
                    const itemsToShow = data.items.slice(start, end);

                    itemsToShow.forEach(item => {
                        newHTML += `
                            <div class="feed-post">
                                <span class="platform-tag">${source.tag}</span>
                                <span class="source-name">${source.name}</span>
                                <a href="${item.link}" target="_blank" class="post-title">${item.title}</a>
                                <div class="post-meta">
                                    <span>🕒 ${new Date(item.pubDate).toLocaleDateString()}</span>
                                    <span>👁️ ${Math.floor(Math.random() * 1000) + postCount * 10} Views</span>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (e) { console.error("Uplink failed"); }
        }

        // Append the new posts to the bottom
        feedContainer.insertAdjacentHTML('beforeend', newHTML);
        postCount += 3; // Prepare next slice
        isLoading = false;
        document.getElementById('hq-loader').style.display = 'none';
    }

    // 3. THE WATCHER: DETECTS WHEN YOU REACH THE BOTTOM
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
            console.log("Bottom reached! Loading more...");
            loadMorePosts();
        }
    }, { threshold: 1.0 });

    // Start watching the sentinel
    observer.observe(document.getElementById('hq-sentinel'));

    // Initial load
    window.onload = loadMorePosts;
</script>
