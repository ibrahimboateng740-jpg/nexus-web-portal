<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Podcast HQ | TheNexusWeb</title>
    <style>
        :root { --nexus-red: #d81e06; --nexus-dark: #1a1a1a; --nexus-bg: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--nexus-bg); text-align: center; overflow-x: hidden; }
        
        /* MATCHING HOME PAGE STATUS STRIP */
        .status-strip { background: var(--nexus-dark); color: #fff; padding: 10px 30px; font-size: 11px; display: flex; justify-content: space-between; font-family: monospace; border-bottom: 2px solid var(--nexus-red); }
        .stat-item { display: flex; align-items: center; gap: 8px; }
        .live-dot { height: 8px; width: 8px; background: #28a745; border-radius: 50%; animation: pulse 2s infinite; }

        /* NAV & LAYOUT */
        .nav-bar { display: flex; justify-content: flex-end; padding: 20px 40px; gap: 25px; }
        .nav-bar a { text-decoration: none; color: #5f6368; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .nav-bar a:hover { color: var(--nexus-red); }
        
        .main-hub { margin-top: 40px; padding: 0 40px; }
        .nexus-logo { font-size: 80px; font-weight: 900; color: var(--nexus-red); font-family: serif; margin-bottom: 10px; letter-spacing: -4px; text-decoration: none; display: block; }
        .sub-header { font-size: 14px; color: #555; margin-bottom: 40px; font-weight: bold; letter-spacing: 2px; }

        /* PODCAST GRID SYSTEM */
        .container { max-width: 1200px; margin: auto; text-align: left; }
        .podcast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding-bottom: 120px; }
        
        .p-card { background: #fff; border-radius: 12px; padding: 15px; border: 1px solid #dfe1e5; transition: 0.3s; position: relative; }
        .p-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: var(--nexus-red); transform: translateY(-5px); }
        .p-art { width: 100%; aspect-ratio: 1/1; border-radius: 8px; margin-bottom: 15px; object-fit: cover; background: #eee; }
        .p-title { font-weight: bold; font-size: 16px; color: #1a1a1a; display: block; margin-bottom: 5px; height: 45px; overflow: hidden; }
        .p-meta { font-size: 12px; color: #70757a; margin-bottom: 20px; text-transform: uppercase; font-weight: bold; }

        /* INTERACTION BUTTONS */
        .btn-row { display: flex; gap: 10px; }
        .btn-play { flex: 2; background: #f8f9fa; border: 1px solid #dfe1e5; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #3c4043; transition: 0.2s; }
        .btn-play:hover { background: var(--nexus-red); color: #fff; border-color: var(--nexus-red); }
        .btn-vault { flex: 1; background: #f8f9fa; border: 1px solid #dfe1e5; border-radius: 6px; cursor: pointer; font-size: 18px; }
        .btn-vault:hover { background: #e8f0fe; color: var(--nexus-blue); }

        /* THE NEXUS PLAYER BAR */
        .nexus-player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nexus-dark); color: #fff; padding: 15px 50px; border-top: 3px solid var(--nexus-red); display: none; align-items: center; gap: 30px; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
        #audio-track { flex-grow: 1; height: 35px; filter: invert(100%) hue-rotate(180deg); }
        .track-display { min-width: 250px; font-size: 12px; line-height: 1.4; }
        .track-display strong { color: var(--nexus-red); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="status-strip">
    <div class="stat-item"><div class="live-dot"></div> AUDIO UPLINK: <span id="sys-status">ACTIVE</span></div>
    <div class="stat-item">📍 <span id="user-location">DETECTING...</span></div>
    <div class="stat-item">☁️ <span id="user-weather">SYNCING...</span></div>
    <div class="stat-item">🕒 <span id="local-clock">00:00:00</span></div>
</div>

<div class="nav-bar">
    <a href="/">Search Hub</a>
    <a href="/news">Global News</a>
    <a href="/social">Social</a>
    <a href="/login" th:text="${username != null ? 'HQ Dashboard' : 'Sign In'}">Sign In</a>
</div>

<div class="main-hub">
    <a href="/" class="nexus-logo">TheNexusWeb</a>
    <div class="sub-header">PODCAST INTELLIGENCE HUB</div>

    <div class="container">
        <div id="loading" style="text-align: center; padding: 100px; color: #70757a; font-weight: bold;">
            📡 SYNCING GLOBAL AUDIO NODES...
        </div>
        <div id="podcast-feed" class="podcast-grid"></div>
    </div>
</div>

<div id="nexus-player" class="nexus-player">
    <div class="track-display">
        <strong id="playing-title">NOW STREAMING</strong><br>
        <span id="playing-show">Idle Station</span>
    </div>
    <audio id="audio-track" controls></audio>
</div>

<script th:inline="javascript">
    // --- 1. CLOCK & STATUS ENGINE (Mirrored from Home) ---
    function startClock() {
        setInterval(() => {
            document.getElementById('local-clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    }

    // --- 2. LOCATION & WEATHER (Mirrored from Home) ---
    async function initIntelligence() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                try {
                    const locRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const locData = await locRes.json();
                    const city = locData.address.city || locData.address.town || "Global Node";
                    document.getElementById('user-location').innerText = city.toUpperCase();

                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const weatherData = await weatherRes.json();
                    document.getElementById('user-weather').innerText = Math.round(weatherData.current_weather.temperature) + "°C";
                } catch (e) { console.error("Intel Link Failed"); }
            });
        }
    }

    // --- 3. PODCAST DATA ENGINE (With Refresh Logic) ---
    const nodeFeeds = [
        "https://feeds.simplecast.com/54nAGpIl", // The Daily
        "https://feeds.megaphone.fm/WVP9506052140", // Waveform
        "https://podcast.ted.com/rss/tedtalksdaily.xml", // TED
        "https://feeds.npr.org/510318/podcast.xml" // Up First
    ];

    async function loadPodcasts() {
        const grid = document.getElementById('podcast-feed');
        const loader = document.getElementById('loading');
        
        for (let feedUrl of nodeFeeds) {
            try {
                // Bridge to fetch live XML as JSON
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}&_=${Date.now()}`);
                const data = await response.json();

                if (data.status === 'ok') {
                    loader.style.display = 'none';
                    const episode = data.items[0];
                    
                    const card = `
                        <div class="p-card">
                            <img src="${data.feed.image}" class="p-art">
                            <span class="p-meta">${data.feed.title}</span>
                            <a href="#" class="p-title">${episode.title}</a>
                            <div class="btn-row">
                                <button class="btn-play" onclick="nexusPlay('${episode.title}', '${data.feed.title}', '${episode.enclosure.link}')">▶ LISTEN</button>
                                <button class="btn-vault" title="Add to Vault" onclick="alert('Logic Saved')">💾</button>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', card);
                }
            } catch (e) { console.error("Node offline: " + feedUrl); }
        }
    }

    function nexusPlay(title, show, url) {
        const player = document.getElementById('nexus-player');
        const audio = document.getElementById('audio-track');
        player.style.display = 'flex';
        document.getElementById('playing-title').innerText = title.toUpperCase();
        document.getElementById('playing-show').innerText = show;
        audio.src = url;
        audio.play();
    }

    window.onload = () => {
        startClock();
        initIntelligence();
        loadPodcasts();
    };
</script>

</body>
</html>
