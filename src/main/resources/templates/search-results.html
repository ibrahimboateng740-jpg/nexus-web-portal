<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('TheNexusWeb - Search')}">
    </head>
<body class="h-screen w-screen flex flex-col overflow-hidden">
    
    <meta charset="UTF-8">
    <title>Nexus Intelligence | Search</title>
    <style>
        :root { --nexus-red: #d81e06; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; }
        .header { padding: 20px 50px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 30px; }
        .logo { font-family: serif; font-weight: 900; color: var(--nexus-red); font-size: 24px; text-decoration: none; }
        .search-bar { width: 500px; padding: 12px 20px; border-radius: 25px; border: 1px solid #dfe1e5; outline: none; }
        .container { max-width: 800px; margin: 30px 150px; }
        .result-item { margin-bottom: 30px; }
        .result-url { font-size: 14px; color: #202124; margin-bottom: 4px; }
        .result-title { font-size: 20px; color: #1a0dab; text-decoration: none; display: block; margin-bottom: 4px; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: #4d5156; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">TheNexusWeb</a>
        <form action="/search" method="GET">
            <input type="text" name="q" class="search-bar" th:value="${userQuery}">
        </form>
    </div>
    <div class="container">
        <p style="color: #70757a; font-size: 14px;">Logic results for: <b th:text="${userQuery}"></b></p>
        
        <div class="result-item">
            <div class="result-url">https://thenexusweb.com > <span th:text="${userQuery}"></span></div>
            <a href="#" class="result-title">Global Data regarding <span th:text="${userQuery}"></span></a>
            <div class="result-snippet">Nexus Logic Engine has scanned decentralized nodes. Comprehensive intelligence on <span th:text="${userQuery}"></span> is now aggregated for HQ viewing...</div>
        </div>

        <div id="dynamic-results"></div>
    </div>

    <script>
        // Simple logic to generate more results based on your query
        const query = "[[${userQuery}]]";
        const resultsBox = document.getElementById('dynamic-results');
        const platforms = ['Wikipedia', 'Reuters', 'Wired', 'GitHub', 'LinkedIn'];
        
        platforms.forEach(p => {
            resultsBox.innerHTML += `
                <div class="result-item">
                    <div class="result-url">https://${p.toLowerCase()}.com > news</div>
                    <a href="#" class="result-title">${p} Insight on ${query}</a>
                    <div class="result-snippet">Latest updates and technical documentation regarding ${query} via ${p} official channels.</div>
                </div>`;
        });
    </script>
</body>
</html>
