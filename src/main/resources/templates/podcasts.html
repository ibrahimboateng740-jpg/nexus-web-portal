<div class="search-section" style="margin: 20px 0;">
    <input type="text" id="pod-search" placeholder="Search Podcasts..." style="padding:10px; width:300px; border-radius:20px; border:1px solid #ddd;">
    <button onclick="searchPodcasts()" style="padding:10px 20px; border-radius:20px; background:var(--nexus-red); color:#fff; border:none; cursor:pointer;">Search</button>
</div>

<div id="podcast-feed" class="podcast-grid"></div>

<script>
    // RSS Bridge to get unlimited podcasts
    async function searchPodcasts() {
        const query = document.getElementById('pod-search').value || 'technology';
        const grid = document.getElementById('podcast-feed');
        grid.innerHTML = 'Scanning...';
        
        // Using ITunes API (Free, no key needed, refreshed daily)
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=podcast&limit=12`);
        const data = await res.json();
        
        grid.innerHTML = '';
        data.results.forEach(pod => {
            grid.innerHTML += `
                <div class="p-card">
                    <img src="${pod.artworkUrl600}" class="p-art">
                    <span class="p-title">${pod.collectionName}</span>
                    <button class="btn-play" onclick="nexusPlay('${pod.collectionName}', '${pod.artistName}', '${pod.feedUrl}')">▶ LISTEN</button>
                </div>`;
        });
    }

    function nexusPlay(title, artist, feedUrl) {
        // To play from a feed, we need to grab the MP3. 
        // For now, we link them to the preview or feed.
        alert("Establishing Link to: " + title);
        const player = document.getElementById('nexus-player');
        player.style.display = 'flex';
        document.getElementById('playing-title').innerText = title;
        // In a full build, you'd parse the feedUrl for the latest MP3
    }
    window.onload = searchPodcasts;
</script>
