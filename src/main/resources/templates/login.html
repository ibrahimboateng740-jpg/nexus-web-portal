<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>TheNexusWeb - Login Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: Arial, sans-serif; }
        .nexus-blue { color: #0254eb; }
        .portal-panel-header { background: linear-gradient(to bottom, #f5fafe 0%, #e4f2fc 100%); border-bottom: 1px solid #7bc5ff; }
        .nexus-input { border: 1px solid #7bc5ff; border-radius: 4px; padding: 8px; width: 100%; font-size: 13px; outline: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">
    <header class="w-full bg-[#f4f7f9] border-b border-gray-300 px-4 py-1.5 flex justify-between items-center text-xs text-gray-600">
        <div class="flex items-center gap-4"><strong>TheNexusWeb Gateway</strong> <a href="/" class="text-blue-700 hover:underline">Home</a></div>
    </header>
    <section class="w-full max-w-6xl mx-auto pt-8 pb-4 px-4 flex flex-col items-center">
        <h1 class="text-4xl font-black italic nexus-blue">TheNexusWeb<span class="not-italic text-amber-500">!</span></h1>
        <span class="text-[10px] font-bold bg-blue-50 border border-blue-200 px-1.5 rounded uppercase font-mono mt-1">SECURE_GATEWAY</span>
    </section>
    <div class="flex-1 max-w-xl w-full mx-auto p-4">
        <div class="border border-gray-300 rounded overflow-hidden bg-white shadow-lg">
            <div class="portal-panel-header px-4 py-3 flex justify-between items-center"><h2 class="text-sm font-bold text-gray-800">Verify Identity Credentials</h2></div>
            <div class="p-8 flex flex-col gap-5">
                <div><label class="text-xs font-bold text-gray-700 block mb-1">Username or Engine ID:</label><input type="text" class="nexus-input"></div>
                <div><label class="text-xs font-bold text-gray-700 block mb-1">Passkey Hash:</label><input type="password" class="nexus-input"></div>
                <button class="w-full bg-gradient-to-b from-[#bce1fd] to-[#7bc5ff] border border-[#4a89c0] py-2.5 rounded font-bold text-blue-900 shadow hover:to-[#5caee6]">Initialize Login</button>
                <div class="text-center pt-2"><a href="/signup" class="text-xs text-blue-700 hover:underline">Request New Account Profile</a></div>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
