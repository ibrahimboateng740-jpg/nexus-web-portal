<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nexus Portal - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1c20; color: #e1e4e6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .login-container { width: 400px; background: #111215; border: 1px solid #2d3139; border-radius: 12px; padding: 40px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); text-align: center; }
        .brand-header { margin-bottom: 30px; }
        .brand-header h2 { color: #00bcd4; font-size: 28px; letter-spacing: 1px; margin-bottom: 8px; }
        .brand-header p { color: #787f95; font-size: 14px; }
        
        /* Form Field Styling */
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; color: #a0a5b5; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { width: 100%; background: #1a1c20; border: 1px solid #2d3139; border-radius: 6px; padding: 12px 16px; color: #ffffff; font-size: 15px; transition: border-color 0.2s; }
        .form-input:focus { outline: none; border-color: #00bcd4; }
        
        /* Native Login Button */
        .btn-submit { width: 100%; background: #00bcd4; color: #111215; border: none; border-radius: 6px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #008ba3; }
        
        /* Visual Divider Line */
        .divider { display: flex; align-items: center; text-align: center; color: #51586d; font-size: 12px; font-weight: 600; text-transform: uppercase; margin: 30px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #2d3139; }
        .divider:not(:empty)::before { margin-right: .75em; }
        .divider:not(:empty)::after { margin-left: .75em; }
        
        /* Google Action Button */
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #1e222b; border: 1px solid #2d3139; color: #ffffff; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .google-btn:hover { background: #252a36; border-color: #a0a5b5; }
        .google-icon { width: 18px; height: 18px; }
        
        .footer-text { margin-top: 30px; font-size: 14px; color: #787f95; }
        .footer-text a { color: #00bcd4; text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <h2>NEXUS</h2>
            <p>Welcome back! Sign in to secure your node.</p>
        </div>
        
        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Enter your credentials" autocomplete="off" />
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" />
            </div>
            
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
        
        <div class="divider">or continue with</div>
        
        <a href="/oauth2/authorization/google" class="google-btn">
            <img class="google-icon" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_活跃图标.svg" alt="Google Logo"/>
            Sign In with Google
        </a>
        
        <div class="footer-text">
            New to the platform? <a href="/signup">Create an account</a>
        </div>
    </div>

</body>
</html>
