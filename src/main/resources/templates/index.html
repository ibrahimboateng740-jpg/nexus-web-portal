<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheNexusWeb | Central Portal</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #8A2BE2; --text: #c9d1d9; --border: #30363d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; }
        
        /* SIDEBAR */
        nav { width: 260px; height: 100vh; background: #000; border-right: 1px solid var(--border); position: fixed; padding: 20px; box-sizing: border-box; }
        .brand { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 30px; }
        nav a { color: #888; text-decoration: none; padding: 12px; border-radius: 8px; display: block; margin-bottom: 5px; }
        nav a:hover { background: var(--card); color: white; }

        /* MAIN */
        main { margin-left: 260px; width: 100%; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); background: rgba(13,17,23,0.9); position: sticky; top: 0; z-index: 100; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 25px; margin: 20px; }

        /* SEARCH FIX */
        .gsc-control-cse { background-color: transparent !important; border: none !important; }
        input.gsc-input { color: #fff !important; background: #0d1117 !important; }
    </style>
</head>
<body>

<nav>
    <div class="brand">TheNexusWeb</div>
    <a href="/">🏠 Home</a>
    <a href="#">📰 Tech News</a>
    <a href="#">👥 Social</a>
    <div id="auth-nav"></div>
    <div style="margin-top:20px; padding:15px; background:#1c2128; border-radius:10px; border:1px solid var(--border);">
        <small style="color:#888;">Accra Weather</small><br><strong>28°C</strong> Partly Cloudy
    </div>
</nav>

<main>
    <header>
        <h3 id="greeting">...</h3>
        <div id="header-tools"></div>
    </header>

    <div class="card" style="border-left: 5px solid var(--accent);">
        <h2>Global Nexus Search</h2>
        <script async src="https://cse.google.com/cse.js?cx=30c4d041d5b7a45b8"></script>
        <div class="gcse-searchbox-only" data-resultsUrl="/search"></div>
    </div>
</main>

<div style="width:100%;height:auto;position:fixed;text-align:center;bottom:0;left:0;right:0;z-index:99999;background:#000;border-top:1px solid #333;">
    <iframe data-aa="2437525" src="//acceptable.a-ads.com/2437525/?size=Adaptive" style="border:0; padding:0; width:100%; height:90px; overflow:hidden;"></iframe>
</div>

<script>
    function updateGreeting() {
        const hour = new Date().getHours();
        const g = document.getElementById('greeting');
        let user = localStorage.getItem('username') || "Developer";
        
        if (hour < 12) g.innerText = "Good Morning, " + user;
        else if (hour < 18) g.innerText = "Good Afternoon, " + user;
        else g.innerText = "Good Evening, " + user;
    }

    function checkAuth() {
        const h = document.getElementById('header-tools');
        const loggedIn = localStorage.getItem('isLoggedIn') === 'true';
        if (loggedIn) {
            h.innerHTML = `🔔 <a href="/settings" style="text-decoration:none; margin:0 15px;">⚙️</a> <button onclick="localStorage.clear(); location.reload();">Sign Out</button>`;
        } else {
            h.innerHTML = `<a href="/login" style="background:var(--accent); color:white; padding:8px 15px; border-radius:5px; text-decoration:none;">Sign In</a>`;
        }
    }

    updateGreeting();
    checkAuth();
</script>
</body>
</html>
