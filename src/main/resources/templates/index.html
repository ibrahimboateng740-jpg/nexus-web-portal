<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheNexusWeb | Global Portal</title>
    <style>
        :root { --nexus-red: #d81e06; --nexus-dark: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fff; text-align: center; }
        
        /* STATUS STRIP */
        .status-strip { background: var(--nexus-dark); color: #fff; padding: 8px 30px; font-size: 11px; display: flex; justify-content: space-between; font-family: monospace; }
        .location-tag { color: #28a745; font-weight: bold; }

        .nav-bar { display: flex; justify-content: flex-end; padding: 20px 40px; gap: 25px; }
        .nav-bar a { text-decoration: none; color: #5f6368; font-size: 14px; font-weight: 500; }
        
        .main-hub { margin-top: 80px; }
        .nexus-logo { font-size: 95px; font-weight: 900; color: var(--nexus-red); font-family: serif; margin-bottom: 30px; letter-spacing: -3px; }
        
        .search-container { max-width: 580px; margin: auto; }
        .search-input { width: 100%; padding: 14px 25px; border-radius: 30px; border: 1px solid #dfe1e5; font-size: 16px; outline: none; transition: 0.2s; }
        .search-input:hover { box-shadow: 0 1px 6px rgba(32,33,36,0.28); }

        .btn-row { margin-top: 30px; display: flex; justify-content: center; gap: 12px; }
        .btn { background: #f8f9fa; border: 1px solid #f8f9fa; padding: 10px 24px; border-radius: 4px; cursor: pointer; color: #3c4043; font-size: 14px; }

        /* NOTIFICATIONS */
        #notification-box { position: fixed; bottom: 25px; right: 25px; z-index: 1000; }
        .toast { background: #202124; color: #fff; padding: 14px 28px; border-radius: 10px; font-size: 13px; margin-top: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 12px; animation: slideIn 0.5s forwards; }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
        .dot { height: 10px; width: 10px; background: var(--nexus-red); border-radius: 50%; }
    </style>
</head>
<body>

<div class="status-strip">
    <div>📡 SYSTEM: <span id="sys-status">SCANNING...</span></div>
    <div>📍 LOCATION: <span id="user-city" class="location-tag">DETECTING...</span></div>
    <div>🕒 LOCAL TIME: <span id="local-time">--:--</span></div>
</div>

<div th:if="${username != null}" id="notification-box"></div>

<div class="nav-bar">
    <a href="/social">Social</a>
    <a href="/news">Global News</a>
    <a href="/login" th:text="${username != null ? 'Dashboard' : 'Sign In'}">Sign In</a>
</div>

<div class="main-hub">
    <div class="nexus-logo">TheNexusWeb</div>
    
    <form action="/search" method="GET" class="search-container">
        <input type="text" name="q" class="search-input" placeholder="Search the web with Nexus Logic...">
        <div class="btn-row">
            <input type="submit" class="btn" value="Nexus Search">
            <button type="button" class="btn" onclick="location.href='/help'">Get Help</button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    // 1. LOCATION & CLOCK ENGINE
    function initNexus() {
        // Update Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('local-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // Get Real Location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                try {
                    // Using a free reverse-geocoding API to get the city name
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await res.json();
                    const city = data.address.city || data.address.town || data.address.village || "Unknown";
                    
                    document.getElementById('user-city').innerText = city.toUpperCase();
                    document.getElementById('sys-status').innerText = "OPTIMIZED";
                    
                    if (window.pushNotification) {
                        window.pushNotification(`Nexus established link with ${city} Node.`);
                    }
                } catch (e) {
                    document.getElementById('user-city').innerText = "OFFLINE";
                }
            });
        }
    }

    // 2. NOTIFICATION LOGIC (User Only)
    /*[+
    const hqUser = [[${username}]];
    if (hqUser) {
        window.pushNotification = function(message) {
            const container = document.getElementById('notification-box');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<div class="dot"></div> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 6000);
        }

        const oldLoad = window.onload;
        window.onload = () => {
            if(oldLoad) oldLoad();
            pushNotification("Welcome back, " + hqUser);
            initNexus();
        };
    } else {
        window.onload = initNexus;
    }
    +]*/
</script>

</body>
</html>
