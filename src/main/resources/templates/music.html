<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>TheNexusWeb - Music Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: Arial, sans-serif; }
        .nexus-blue { color: #0254eb; }
        .portal-panel-header { background: linear-gradient(to bottom, #f5fafe 0%, #e4f2fc 100%); border-bottom: 1px solid #7bc5ff; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0254eb; border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">
    <header class="w-full bg-[#f4f7f9] border-b border-gray-300 px-4 py-1.5 flex justify-between items-center text-xs text-gray-600">
        <div class="flex items-center gap-4"><strong>TheNexusWeb Headquarters</strong> <a href="/" class="text-blue-700 hover:underline">Home</a></div>
        <div class="font-mono text-[11px]">SYS_STATUS: <strong class="text-emerald-700">ONLINE</strong></div>
    </header>
    <section class="w-full max-w-6xl mx-auto pt-4 pb-2 px-4 flex flex-col md:flex-row items-center gap-6">
        <div class="flex flex-col items-start"><h1 class="text-4xl font-black italic nexus-blue">TheNexusWeb<span class="not-italic text-amber-500">!</span></h1><span class="text-[10px] font-bold bg-blue-50 border border-blue-200 px-1.5 rounded uppercase font-mono">MUSIC_PLAYER</span></div>
        <div class="flex-1 w-full max-w-2xl bg-[#9ecaed] p-1.5 rounded border border-[#66a9e0] shadow-sm"><div class="flex bg-white border border-[#4a89c0]"><input type="text" placeholder="Search artists, songs, or radio stations..." class="flex-1 px-3 py-2 text-sm focus:outline-none"><button class="bg-gradient-to-b from-[#bce1fd] to-[#7bc5ff] px-6 py-2 text-xs font-bold text-blue-900 border-l border-[#4a89c0]">Search</button></div></div>
    </section>
    <div class="flex-1 max-w-6xl w-full mx-auto flex overflow-hidden px-4 pb-4 gap-4">
        <aside class="w-56 border border-gray-300 bg-[#f4f8fb] rounded p-2 overflow-y-auto custom-scrollbar">
            <nav class="flex flex-col gap-0.5">
                <a href="/" class="px-2 py-1.5 text-xs font-bold text-blue-800 hover:bg-white flex items-center gap-2"><i data-lucide="home" class="w-3.5 h-3.5"></i> Our Front Page</a>
                <a href="/music" class="px-2 py-1.5 text-xs font-bold text-blue-900 bg-white border border-[#7bc5ff] rounded flex items-center gap-2 shadow-sm"><i data-lucide="music" class="w-3.5 h-3.5 text-blue-600"></i> Music Node</a>
            </nav>
        </aside>
        <main class="flex-1 border border-gray-300 rounded overflow-hidden bg-white flex flex-col">
            <div class="portal-panel-header px-3 py-2 flex justify-between items-end border-b border-gray-300"><h2 class="text-sm font-bold text-gray-800 pb-1.5">Audio Streaming Console</h2></div>
            <div class="flex-1 p-6 overflow-y-auto custom-scrollbar">
                <div class="bg-gray-50 border border-gray-200 rounded p-6 flex items-center gap-6">
                    <button class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="play" class="w-8 h-8 fill-white ml-1"></i></button>
                    <div class="flex-1">
                        <h3 class="text-sm font-bold text-blue-900">Now Streaming: Wired Logic Beats</h3>
                        <div class="w-full bg-gray-200 h-1.5 rounded-full mt-3"><div class="w-1/3 h-full bg-blue-600 rounded-full"></div></div>
                    </div>
                </div>
            </div>
        </main>
        <aside class="w-72 border border-[#7bc5ff] rounded overflow-hidden bg-[#f4f7f9] p-3 text-xs"><h3 class="font-bold text-blue-900 mb-2">Top Transmissions</h3><ul class="flex flex-col gap-2"><li>1. EP01 - Logic Gates</li></ul></aside>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
