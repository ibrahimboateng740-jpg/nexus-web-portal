<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheNexusWeb | Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000000; --panel: #1a1a1a; --accent: #8A2BE2; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; }

        /* SIDEBAR (AOL CHANNELS STYLE) */
        nav { 
            width: 220px; height: 100vh; background: #111; border-right: 2px solid #333; 
            position: fixed; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
        }
        .brand-box { padding: 10px 0; border-bottom: 1px solid #333; margin-bottom: 20px; text-align: center; }
        .brand-box h1 { font-size: 1.2rem; color: var(--accent); margin: 0; letter-spacing: 1px; }

        .channel-link { 
            display: flex; align-items: center; color: #bbb; text-decoration: none; 
            padding: 12px; margin-bottom: 5px; border-radius: 5px; transition: 0.2s;
        }
        .channel-link i { width: 25px; color: var(--accent); font-size: 1.1rem; }
        .channel-link:hover { background: #222; color: #fff; }
        .channel-link.active { background: var(--accent); color: white; }
        .channel-link.active i { color: white; }

        /* MAIN STAGE */
        main { margin-left: 220px; width: calc(100% - 220px); min-height: 100vh; }
        
        /* TOP GREETING BAR */
        .top-shelf {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: #111; border-bottom: 1px solid #333;
        }

        /* CENTRAL SEARCH (AOL LANDING STYLE) */
        .welcome-center {
            max-width: 700px; margin: 60px auto; text-align: center; padding: 0 20px;
        }
        .welcome-center h2 { font-size: 2rem; margin-bottom: 10px; }
        .search-container {
            background: #fff; padding: 5px; border-radius: 50px; 
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); margin-top: 30px;
        }

        /* BUTTONS */
        .btn-sign { background: var(--accent); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }

        /* WEATHER FOOTER IN SIDEBAR */
        .sidebar-weather { margin-top: auto; background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

<nav>
    <div class="brand-box">
        <h1>TheNexusWeb</h1>
    </div>
    <a href="/" class="channel-link active"><i class="fa-solid fa-house"></i> Home</a>
    <a href="#" class="channel-link"><i class="fa-solid fa-newspaper"></i> News</a>
    <a href="#" class="channel-link"><i class="fa-solid fa-cloud-sun"></i> Weather</a>
    <a href="#" class="channel-link"><i class="fa-solid fa-comments"></i> Social</a>
    <div id="logged-in-links"></div>
    <a href="#" class="channel-link"><i class="fa-solid fa-circle-question"></i> Help</a>

    <div class="sidebar-weather">
        <small style="color: #888;">ACCRA, GH</small>
        <div style="font-size: 1.2rem; font-weight: bold;">28°C ☁️</div>
    </div>
</nav>

<main>
    <div class="top-shelf">
        <div id="greeting" style="font-weight: bold; color: #888;">Checking system...</div>
        <div id="auth-ui"></div>
    </div>

    <div class="welcome-center">
        <h2>Welcome to TheNexusWeb</h2>
        <p style="color: #888;">Your logic-driven gateway to the technical world.</p>
        
        <div class="search-container">
            <script async src="https://cse.google.com/cse.js?cx=30c4d041d5b7a45b8"></script>
            <div class="gcse-searchbox-only" data-resultsUrl="/search"></div>
        </div>
    </div>
</main>

<div style="position: fixed; bottom: 0; left: 220px; right: 0; background: #000; border-top: 1px solid #333; height: 90px; text-align: center;">
    <iframe data-aa="2437525" src="//acceptable.a-ads.com/2437525/?size=Adaptive" style="border:0; padding:0; width:100%; height:90px; overflow:hidden;"></iframe>
</div>

<script>
    function loadPortal() {
        const hour = new Date().getHours();
        const g = document.getElementById('greeting');
        const auth = document.getElementById('auth-ui');
        const side = document.getElementById('logged-in-links');
        
        const user = localStorage.getItem('username') || "Guest";
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

        // GREETING
        let msg = (hour < 12) ? "Good Morning" : (hour < 18) ? "Good Afternoon" : "Good Evening";
        g.innerText = `${msg}, ${user}`;

        // AUTH UI
        if (isLoggedIn) {
            auth.innerHTML = `<span style="margin-right:15px;">🔔</span> <button onclick="logout()" style="background:none; border:1px solid #f85149; color:#f85149; cursor:pointer; padding:5px 10px; border-radius:15px;">Sign Out</button>`;
            side.innerHTML = `<a href="#" class="channel-link"><i class="fa-solid fa-gear"></i> Settings</a>`;
        } else {
            auth.innerHTML = `<a href="/login" class="btn-sign">Sign In</a>`;
        }
    }

    function logout() {
        localStorage.clear();
        window.location.reload();
    }

    loadPortal();
</script>

</body>
</html>
